[project]
name = "ai-agent-service"
version = "0.2.0"
description = "Async, schema-first AI agent service with LangGraph, layered memory, RAG, retries and fallbacks."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
authors = [{ name = "chenchufan8-prog" }]
dependencies = [
  "aiosqlite>=0.21,<1",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "langgraph>=1.0,<2",
  "openai>=1.109,<3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pypdf>=6,<7",
  "python-dotenv>=1.1,<2",
  "tenacity>=9.1,<10",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
documents = ["docling>=2.50,<3"]
vector = ["qdrant-client>=1.15,<2"]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_service"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "ASYNC", "RUF"]
ignore = ["E501", "RUF001", "UP046"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agent_service"]
exclude = ["tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "docling.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "qdrant_client.*"
ignore_missing_imports = true
