global:
  resolve_timeout: 5m

route:
  receiver: local-operations
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: local-operations
    webhook_configs:
      - url: http://127.0.0.1:5001/agentforge-alerts
        send_resolved: true
