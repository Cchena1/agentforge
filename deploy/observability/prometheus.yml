global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: agentforge
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8000"]
